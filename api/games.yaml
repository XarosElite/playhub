common_fields:
  SERVER_NAME:
    type: string
    default: ""
  SERVER_DESCRIPTION:
    type: string
    default: ""
  SERVER_PASSWORD:
    type: password
    default: ""
  ADMIN_PASSWORD:
    type: password
    default: ""
  MAX_PLAYERS:
    type: integer
    default: 20
    min: 1
    max: 100

minecraft:
  image: itzg/minecraft-server
  internal_port: 25565
  default_port: 25565
  common_fields:
    - MAX_PLAYERS
  fields:
    EULA:
      type: boolean
      default: true
    MODE:
      type: string
      enum: [survival, creative, adventure, spectator]
      default: survival
    PVP:
      type: boolean
      default: true
    HARDCORE:
      type: boolean
      default: false
    ENABLE_COMMAND_BLOCK:
      type: boolean
      default: false
    SEED:
      type: string
      default: ""
    WORLD_TYPE:
      type: string
      default: "normal"
  docker_override: {}

palworld:
  image: thijsvanloef/palworld-server-docker:latest
  internal_port: 8211
  default_port: 8211
  common_fields:
    - SERVER_NAME
    - SERVER_DESCRIPTION
    - SERVER_PASSWORD
    - ADMIN_PASSWORD
  fields:
    CUSTOM_NAME:
      type: string
      default: "LIVE RENDER BABYYYYYY"
    DIFFICULTY:
      type: string
      enum: [Casual, Normal, Hard]
      default: Normal
    EXP_RATE:
      type: number
      default: 1.0
    PAL_SPAWN:
      type: number
      default: 1.0
    COMMUNITY:
      type: boolean
      default: false
    PLAYERS:
      type: integer
      min: 1
      max: 100
      default: 32
  docker_override: {}
