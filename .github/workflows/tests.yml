name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (pytest, Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playhub
          POSTGRES_PASSWORD: playhub
          POSTGRES_DB: playhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U playhub -d playhub_test"
          --health-interval 2s --health-retries 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing:skip-covered
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://playhub:playhub@localhost:5432/playhub_test

  worker:
    name: Worker (pytest, Postgres, real Docker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playhub
          POSTGRES_PASSWORD: playhub
          POSTGRES_DB: playhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U playhub -d playhub_test"
          --health-interval 2s --health-retries 20
    defaults:
      run:
        working-directory: docker-executer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docker-executer/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: docker pull redis:7
      - run: pytest --cov=tasks --cov-report=term-missing:skip-covered
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://playhub:playhub@localhost:5432/playhub_test
          RUN_DOCKER_TESTS: "1"

  frontend:
    name: Frontend (lint, types, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint --max-warnings 0
      - run: yarn test:coverage
      - run: yarn build

  e2e:
    name: Frontend (Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g yarn@1.22.22 && yarn install --frozen-lockfile
      - run: yarn test:e2e
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
